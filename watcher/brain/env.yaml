# Phase 2 only, not used by this build: the Harness Runtime environment for the Kraken's Brain (design section
# 11.5). The docs describe environments, tool providers and permission policies but publish no schema, so the
# field names below are a plan to check against the real format (BUGS.md, Harness Runtime REST shapes).
name: kraken-brain
agent: claude-code
size: mars-1vcpu-1gb
region: tor1
tools:
  - provider: porthole
    kind: mcp
    transport: streamable-http
    url: https://insights-demo.digitalocean.solutions/mcp
    credential:
      type: api_key
      from_secret: PORTHOLE_MCP_KEY   # the key the head's MCP server requires
permissions:
  default: deny
  rules:
    - {tool: porthole.fleet_describe, action: allow}
    - {tool: porthole.tentacle_status, action: allow}
    - {tool: porthole.insights_query_range, action: allow}
    - {tool: porthole.insights_alert_instances, action: allow}
    - {tool: porthole.insights_logs_search, action: allow}
    - {tool: porthole.scenario_start, action: ask}
    - {tool: porthole.scenario_stop, action: ask}
    - {tool: porthole.voyage_start, action: ask}
egress:
  allow:
    - insights-demo.digitalocean.solutions
secrets:
  - name: MODEL_API_KEY      # set in the control panel; never in this file
  - name: PORTHOLE_MCP_KEY
