name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install
        run: pip install -r requirements-dev.txt
      - name: head tests
        run: cd head && python -m pytest -q
      - name: infra tests
        run: cd infra && python -m pytest -q
      - name: harness tests
        run: cd harness && python -m pytest -q
      - name: tentacle tests
        run: cd tentacle && python -m pytest -q
      - name: ruff
        run: ruff check .
      - name: pip-audit
        run: pip-audit -r head/requirements.txt -r tentacle/requirements.txt -r infra/requirements.txt
      - name: leak sweep
        run: python scripts/leak_sweep.py
      - name: metric names in the catalog
        run: python scripts/check_metric_names.py
      - name: smoke
        run: bash head/dev/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: charts.js unit tests
        run: node --test "head/tests/js/*.test.mjs"
